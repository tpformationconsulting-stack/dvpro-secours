# DV Pro : chaque jour, copie de secours du registre des copropriétés, publiée sur GitHub Pages.
# Gratuit pour un dépôt public. Si la construction échoue, rien n'est publié : la copie de la veille reste en ligne.
name: Copie du registre
on:
  schedule:
    - cron: '35 9 * * *'   # 9 h 35 UTC, après la mise en ligne du fichier quotidien (vers 7 h UTC)
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construire la copie
        run: python3 construire_registre.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
