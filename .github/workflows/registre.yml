# DV Pro : chaque jour, copie de secours du registre des copropriétés et de la liste des communes, publiée sur GitHub Pages.
# Gratuit pour un dépôt public. Si la construction du registre échoue, rien n'est publié : la copie de la veille reste en ligne.
# 435r (04/11/2026) : outils GitHub à jour (Node 24), et une petite trace mensuelle pour que GitHub
# n'arrête pas la tâche après 60 jours sans activité sur le dépôt.
# 444r (12/11/2026) : la liste des communes (geo/communes.json) est publiée avec le registre. Si le service des communes
# ne répond pas ce jour-là, la liste déjà en ligne est reprise telle quelle, avec sa date.
name: Copie du registre
on:
  schedule:
    - cron: '35 9 * * *'   # 9 h 35 UTC, après la mise en ligne du fichier quotidien (vers 7 h UTC)
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Construire la copie
        run: python3 construire_registre.py site
      - name: Ajouter la liste des communes
        continue-on-error: true   # un échec ici n'empêche jamais la publication du registre
        timeout-minutes: 12       # au pire 12 minutes : le registre est publié de toute façon
        run: python3 construire_communes.py site "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
      - name: Garder la tâche active (règle des 60 jours de GitHub)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          derniere=$(git log -1 --format=%ct)
          jours=$(( ( $(date +%s) - derniere ) / 86400 ))
          if [ "$jours" -ge 30 ]; then
            date -u +%Y-%m-%d > derniere_activite.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add derniere_activite.txt
            git commit -m "Activité mensuelle : la copie quotidienne reste active"
            git push
          else
            echo "Dernière activité il y a $jours jours : rien à faire."
          fi
